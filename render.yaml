services:
  - type: web
    name: employee-id-card-portal
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: portal-postgres-db
          property: connectionString

databases:
  - name: portal-postgres-db
    databaseName: employee_portal
    user: postgres
    plan: free
